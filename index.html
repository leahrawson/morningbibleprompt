<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morning — A quiet way to begin the day</title>
<meta name="description" content="A private, gentle morning practice for Scripture, reflection, breath, and beginning the day.">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta property="og:title" content="Morning">
<meta property="og:description" content="A quiet way to begin the day with Scripture, reflection, and breath.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23f5f0e7%27/%3E%3Cpath d=%27M12 43h40%27 stroke=%27%23292722%27 stroke-width=%273%27 stroke-linecap=%27round%27/%3E%3Cpath d=%27M20 43a12 12 0 0 1 24 0%27 fill=%27none%27 stroke=%27%23292722%27 stroke-width=%273%27/%3E%3Cpath d=%27M32 14v8M15 27l7 4M49 27l-7 4%27 stroke=%27%23292722%27 stroke-width=%273%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap');

:root { --ink:#29252a; --muted:#29252a; --soft:rgba(255,255,255,.72); }
*{box-sizing:border-box} html,body{margin:0;min-height:100%}
body{min-height:100dvh;font-family:"Newsreader",Georgia,"Times New Roman",serif;color:var(--ink);background:#fff;overflow-x:hidden;position:relative}
/* Figurative sunrise lives in the lower third and dissolves upward into white. */
body::before,body::after{content:"";position:fixed;left:-18vw;right:-18vw;bottom:-18vh;height:58vh;pointer-events:none;z-index:-2;transform-origin:50% 100%}
body::before{background:
 radial-gradient(ellipse 42% 30% at 47% 76%,rgba(255,244,188,.98) 0%,rgba(255,211,128,.88) 18%,rgba(246,158,119,.68) 38%,rgba(195,113,142,.45) 57%,rgba(103,79,133,.26) 73%,transparent 88%),
 radial-gradient(ellipse 28% 20% at 67% 78%,rgba(255,190,115,.72),rgba(223,125,132,.38) 42%,transparent 75%),
 radial-gradient(ellipse 34% 24% at 25% 84%,rgba(111,82,145,.42),rgba(199,111,139,.28) 50%,transparent 78%);
 filter:blur(9px) saturate(1.06);animation:sunriseBreath 14s ease-in-out infinite}
body::after{z-index:-1;bottom:-12vh;height:48vh;background:
 radial-gradient(ellipse 22% 18% at 53% 78%,rgba(255,248,202,.92),rgba(255,195,116,.48) 43%,transparent 76%),
 linear-gradient(to top,rgba(86,67,124,.35) 0%,rgba(190,103,137,.28) 22%,rgba(244,157,125,.30) 43%,rgba(255,211,145,.22) 59%,rgba(255,255,255,0) 88%);
 filter:blur(14px);animation:horizonBreath 14s ease-in-out infinite}
@keyframes sunriseBreath{
  0%,100%{transform:translate3d(0,5%,0) scale(.94,.88);filter:blur(12px) saturate(.96);opacity:.76}
  42.857%{transform:translate3d(0,-8%,0) scale(1.14,1.20);filter:blur(9px) saturate(1.13);opacity:1}
}
@keyframes horizonBreath{
  0%,100%{transform:translate3d(0,6%,0) scale(.92,.86);opacity:.62}
  42.857%{transform:translate3d(0,-10%,0) scale(1.18,1.22);opacity:1}
}
.breath-cue{display:inline-flex;align-items:center;gap:8px;margin:2px 0 clamp(10px,1.8vh,22px);font:600 .65rem "Montserrat",Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);opacity:.78}
.breath-dot{width:7px;height:7px;border-radius:50%;background:rgba(205,139,102,.72);animation:breathDot 14s ease-in-out infinite}
@keyframes breathDot{0%,100%{transform:scale(.72);opacity:.55}42.857%{transform:scale(1.35);opacity:1}}
main{width:min(820px,calc(100% - 34px));min-height:100dvh;margin:0 auto;padding:clamp(28px,5vh,62px) 0 clamp(24px,5vh,60px);display:flex;flex-direction:column;position:relative;z-index:1}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding-bottom:clamp(10px,2vh,20px)}
.eyebrow,.label{font-family:"Montserrat",Arial,sans-serif;text-transform:uppercase;letter-spacing:.17em;font-weight:600;color:var(--muted)}
.eyebrow{font-size:.72rem;margin-bottom:10px}
h1,.verse-text,.intro,.question,textarea{font-family:"Newsreader",Georgia,"Times New Roman",serif} h1{margin:0;font-weight:400;font-style:italic;font-size:clamp(2.6rem,7vw,5rem);line-height:.95;letter-spacing:-.04em}
#date{display:block;font-family:"Montserrat",Arial,sans-serif;color:var(--muted);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px;white-space:nowrap}
.verse{max-width:690px;margin:clamp(10px,2vh,22px) 0 8px;padding:clamp(6px,1vh,10px) 0 clamp(8px,1.4vh,13px)}
.verse .label{font-size:.65rem;margin-bottom:9px}.verse-text{font-size:1.03rem;line-height:1.55;margin:0}.verse-ref{font-family:"Montserrat",Arial,sans-serif;font-size:.7rem;color:var(--muted);margin-top:8px}
.intro{margin:clamp(12px,2.5vh,24px) 0 clamp(14px,3vh,28px);font-size:1.12rem;line-height:1.68;max-width:650px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:clamp(14px,3vh,28px)}button{appearance:none;border:1px solid rgba(75,62,69,.24);background:rgba(255,255,255,.62);color:var(--ink);padding:10px 15px;border-radius:999px;font:500 .96rem/1 "Newsreader",Georgia,"Times New Roman",serif;letter-spacing:.005em;cursor:pointer;backdrop-filter:blur(7px);display:inline-flex;align-items:center;gap:8px;transition:background .2s ease,border-color .2s ease,transform .2s ease}button:hover{background:rgba(255,255,255,.88);border-color:rgba(75,62,69,.42);transform:translateY(-1px)}button:focus-visible{outline:2px solid rgba(173,112,91,.42);outline-offset:3px}.action-icon{width:15px;height:15px;display:inline-block;flex:0 0 auto}
.prompts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(9px,1.4vh,13px)}.card{background:var(--soft);border:0;border-radius:18px;padding:clamp(15px,2.2vh,22px);min-height:0;backdrop-filter:blur(12px)}
.label{font-size:.68rem;margin-bottom:clamp(8px,1.3vh,12px)}.question{font-size:1.1rem;line-height:1.5;margin-bottom:clamp(10px,1.7vh,15px)}.write-field{position:relative}.write-icon{position:absolute;left:13px;top:14px;width:15px;height:15px;color:#29252a;opacity:.72;pointer-events:none;z-index:1}textarea{width:100%;min-height:clamp(68px,9vh,82px);resize:vertical;border:1px solid rgba(75,62,69,.22);border-radius:12px;padding:11px 13px 11px 38px;background:rgba(255,255,255,.34);color:var(--ink);font:1.04rem/1.55 "Newsreader",Georgia,"Times New Roman",serif;outline:none;transition:border-color .2s ease,background .2s ease,box-shadow .2s ease}textarea:hover{border-color:rgba(75,62,69,.38);background:rgba(255,255,255,.46)}textarea:focus{border-color:rgba(173,112,91,.56);background:rgba(255,255,255,.62);box-shadow:0 0 0 3px rgba(210,153,120,.10)}textarea::placeholder{font-family:"Newsreader",Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;color:#29252a;opacity:.72}
.write-field{overflow:hidden;border-radius:12px}
.write-field::after{content:"";position:absolute;inset:-20% -12%;pointer-events:none;opacity:0;transform:translateY(-115%);background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,250,243,.35) 24%,rgba(255,245,230,.94) 48%,rgba(255,255,255,.78) 62%,rgba(255,255,255,0) 100%);filter:blur(3px);z-index:3}
.write-field.washing::after{animation:washAway .95s cubic-bezier(.33,.05,.18,1) forwards}
.write-field.washing textarea{animation:inkRelease .82s ease forwards}
.write-field.washing .write-icon{animation:iconFade .65s ease forwards}
@keyframes washAway{0%{opacity:0;transform:translateY(-115%)}18%{opacity:.95}100%{opacity:0;transform:translateY(115%)}}
@keyframes inkRelease{0%{color:var(--ink);filter:blur(0);transform:translateY(0)}38%{color:rgba(65,54,62,.45);filter:blur(.7px)}100%{color:rgba(65,54,62,0);filter:blur(3px);transform:translateY(7px)}}
@keyframes iconFade{to{opacity:.18}}
button.clear-armed{background:rgba(255,248,241,.9);border-color:rgba(173,112,91,.55)}
button,a,[role="button"]{cursor:pointer}
/* Closing ritual: the page releases its prompts while dawn rises to the verse. */
body.day-begun::before{animation:finalSunrise 14s ease-in-out forwards}
body.day-begun::after{animation:finalHorizon 14s ease-in-out forwards}
body.day-begun .top,body.day-begun .intro,body.day-begun .breath-cue,body.day-begun .actions,body.day-begun .prompts,body.day-begun .site-footer{animation:releasePage 14s ease-in-out forwards;pointer-events:none}
body.day-begun .verse{animation:verseRest 14s ease-in-out forwards;position:relative;z-index:4}
body.day-begun .verse .label{animation:softLabel 14s ease-in-out forwards}
@keyframes releasePage{0%{opacity:1;filter:blur(0);transform:translateY(0)}55%{opacity:.34;filter:blur(1.5px)}100%{opacity:0;filter:blur(7px);transform:translateY(-16px);visibility:hidden}}
@keyframes finalSunrise{0%{transform:translate3d(0,3%,0) scale(.98,.92);filter:blur(11px) saturate(1);opacity:.8}55%{transform:translate3d(0,-42%,0) scale(1.34,1.52);filter:blur(12px) saturate(1.12);opacity:1}100%{transform:translate3d(0,-57%,0) scale(1.5,1.7);filter:blur(16px) saturate(1.05);opacity:.92}}
@keyframes finalHorizon{0%{transform:translate3d(0,4%,0) scale(.96,.9);opacity:.7}60%{transform:translate3d(0,-48%,0) scale(1.42,1.6);opacity:1}100%{transform:translate3d(0,-62%,0) scale(1.58,1.76);opacity:.82}}
@keyframes verseRest{0%{transform:translateY(0) scale(1)}45%{transform:translateY(8vh) scale(1.02)}100%{transform:translateY(18vh) scale(1.045)}}
@keyframes softLabel{to{opacity:.72}}
body.day-begun main{min-height:100dvh}
body.day-begun .verse-text{font-size:clamp(1.15rem,2.2vw,1.35rem);transition:font-size 14s ease-in-out}
body.day-begun .verse-ref{font-size:.74rem}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.site-footer{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:clamp(14px,2.5vh,24px);padding:clamp(8px,1.5vh,14px) 2px 0;font:500 .78rem/1.45 "Newsreader",Georgia,"Times New Roman",serif;color:var(--ink)}
.site-footer p{margin:0}.site-footer a{color:var(--ink);text-underline-offset:3px;text-decoration-thickness:1px}.site-footer a:hover{text-decoration-thickness:2px}
body.day-begun .site-footer{animation:releasePage 14s ease-in-out forwards;pointer-events:none}
@media(min-width:651px) and (max-height:800px){h1{font-size:clamp(2.6rem,6.7vh,3.4rem)}.verse-text{font-size:1rem;line-height:1.45}.intro{font-size:1.05rem;line-height:1.5}.question{font-size:1.03rem;line-height:1.4}textarea{min-height:62px;line-height:1.4}}
@media(max-width:650px){main{width:100%;min-height:100dvh;padding-top:max(36px,env(safe-area-inset-top));padding-right:max(17px,env(safe-area-inset-right));padding-bottom:max(24px,env(safe-area-inset-bottom));padding-left:max(17px,env(safe-area-inset-left))}.top{align-items:flex-start;flex-direction:column;padding-bottom:20px}.verse{margin:22px 0 8px;padding:10px 0 13px}.intro{margin:24px 0 28px}.breath-cue{margin-bottom:22px}.actions{margin-bottom:28px}.prompts{grid-template-columns:1fr;gap:13px}.card{padding:22px}.card .label{margin-bottom:12px}.question{margin-bottom:15px}textarea{min-height:82px}.site-footer{align-items:flex-start;flex-direction:column;gap:7px;margin-top:24px;padding-top:14px}}
@media(prefers-reduced-motion:reduce){body::before,body::after,.breath-dot{animation:none}.breath-cue{display:none}body.day-begun::before,body.day-begun::after,body.day-begun .top,body.day-begun .intro,body.day-begun .breath-cue,body.day-begun .actions,body.day-begun .prompts,body.day-begun .site-footer,body.day-begun .verse,body.day-begun .verse .label{animation:none}body.day-begun .top,body.day-begun .intro,body.day-begun .breath-cue,body.day-begun .actions,body.day-begun .prompts,body.day-begun .site-footer{display:none}body.day-begun .verse{transform:translateY(18vh) scale(1.045)}}
@media print{body{background:white}body::before,body::after,.actions{display:none}main{padding:20px;width:100%}.card{background:#faf7f2}}
</style>
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1>Begin here.</h1>
    </div>
  </header>

  <section class="verse" aria-label="Verse of the Day" tabindex="-1">
    <div class="label">VERSE OF THE DAY</div>
    <p class="verse-text">“This is the day the Lord has made; let us rejoice and be glad in it.”</p>
    <div class="verse-ref">Psalm 118:24</div>
  </section>

  <p class="intro">
    <span id="date"></span>
    Read today’s Scripture, then write only what comes easily.
  </p>

  <div class="breath-cue" aria-live="polite"><span class="breath-dot" aria-hidden="true"></span><span id="breathText">Inhale · 6</span></div>

  <div class="actions">
    <button id="another" type="button"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Another prompt</button>
    <button id="beginDay" type="button"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M14 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Begin the day</button>
  </div>

  <section class="prompts">
    <article class="card">
      <div class="label" id="notice-label">NOTICE</div>
      <div class="question" id="notice"></div>
      <div class="write-field"><svg class="write-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10.5-10.5a2.12 2.12 0 0 0-3-3L5 17v3Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="m14 8 3 3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><textarea data-key="notice" aria-labelledby="notice-label notice" placeholder="Write a few lines…"></textarea></div>
    </article>
    <article class="card">
      <div class="label" id="remember-label">REMEMBER</div>
      <div class="question" id="remember"></div>
      <div class="write-field"><svg class="write-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10.5-10.5a2.12 2.12 0 0 0-3-3L5 17v3Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="m14 8 3 3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><textarea data-key="remember" aria-labelledby="remember-label remember" placeholder="Write a few lines…"></textarea></div>
    </article>
    <article class="card">
      <div class="label" id="hope-label">HOPE</div>
      <div class="question" id="hope"></div>
      <div class="write-field"><svg class="write-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10.5-10.5a2.12 2.12 0 0 0-3-3L5 17v3Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="m14 8 3 3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><textarea data-key="hope" aria-labelledby="hope-label hope" placeholder="Write a few lines…"></textarea></div>
    </article>
    <article class="card">
      <div class="label" id="pray-label">PRAY</div>
      <div class="question" id="pray"></div>
      <div class="write-field"><svg class="write-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10.5-10.5a2.12 2.12 0 0 0-3-3L5 17v3Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="m14 8 3 3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><textarea data-key="pray" aria-labelledby="pray-label pray" placeholder="Write a few lines…"></textarea></div>
    </article>
  </section>

  <footer class="site-footer" aria-label="Site information">
    <p>Private by design. Your reflections stay in this browser.</p>
    <a href="privacy.html">Privacy</a>
  </footer>
</main>

<script>
const prompts = [{"notice": "What word, image, or idea from today’s Scripture is staying with me?", "remember": "Where have I already seen God provide something I could not yet see coming?", "hope": "What good possibility can I leave open today?", "pray": "What outcome can I entrust to God instead of repeatedly evaluating?"}, {"notice": "What in today’s Scripture feels especially relevant to the way I am entering this day?", "remember": "What has changed for the better that I once feared might never change?", "hope": "Where can I allow curiosity to replace prediction today?", "pray": "What am I carrying this morning that I do not need to carry alone?"}, {"notice": "What does this passage invite me to notice about God?", "remember": "What ordinary good thing in my life deserves to be noticed again?", "hope": "What might become possible if I do not decide the ending in advance?", "pray": "What would I like to place in God’s hands before I begin?"}, {"notice": "What part of today’s reading gives me room to breathe?", "remember": "When has a difficult season changed in a way I could not have predicted?", "hope": "What would I genuinely enjoy experiencing today?", "pray": "Where do I need guidance more than certainty?"}, {"notice": "What sentence would I like to carry with me after I close the Bible?", "remember": "What capacity, relationship, interest, or part of ordinary life has returned to me?", "hope": "What small thing could surprise me today?", "pray": "What judgment about myself or my future can wait?"}, {"notice": "What feels encouraging, beautiful, or clarifying in today’s Scripture?", "remember": "What evidence do I have that growth can be quiet and still be real?", "hope": "Where is there more room for change than I have been assuming?", "pray": "What concern can become a prayer instead of a problem to solve right now?"}, {"notice": "If I read this passage without trying to extract a lesson, what simply stands out?", "remember": "What is already good this morning?", "hope": "What am I looking forward to, even a little?", "pray": "What do I want God to help me notice today?"}, {"notice": "What does today’s Scripture say that I would like to believe more deeply?", "remember": "Where has patience produced something worthwhile in my life?", "hope": "What can remain unresolved today without being hopeless?", "pray": "What am I willing to stop rehearsing for now?"}, {"notice": "What quality of God is most visible to me in this passage?", "remember": "Who or what has brought me comfort, delight, or companionship recently?", "hope": "What kind of day would feel alive rather than merely productive?", "pray": "What can I ask for simply because I desire it?"}, {"notice": "What feels different after spending a few minutes with this Scripture?", "remember": "What have I handled recently that once would have felt much harder?", "hope": "What possibility deserves time before I judge it?", "pray": "What can I release from my attention until it actually needs me?"}, {"notice": "What invitation do I hear in today’s passage?", "remember": "What is one concrete piece of evidence that my life is moving?", "hope": "What could I explore today without needing to turn it into anything?", "pray": "Where would I like peace to replace vigilance?"}, {"notice": "What part of this Scripture makes the world seem larger than my current concerns?", "remember": "What good thing arrived through a route I did not plan?", "hope": "What might I notice today if I am not constantly measuring progress?", "pray": "What outcome am I ready to stop checking for a while?"}];

const now = new Date();
document.getElementById("date").textContent =
  now.toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"});

const dateKey = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`;
let index = Number(localStorage.getItem("morningPromptIndex-" + dateKey));
if (!Number.isInteger(index)) {
  let hash = 0;
  for (const c of dateKey) hash = ((hash << 5) - hash) + c.charCodeAt(0);
  index = Math.abs(hash) % prompts.length;
  localStorage.setItem("morningPromptIndex-" + dateKey, index);
}

function showPrompt() {
  const p = prompts[index];
  for (const key of ["notice","remember","hope","pray"]) {
    document.getElementById(key).textContent = p[key];
  }
}
showPrompt();

document.querySelectorAll("textarea").forEach(t => {
  const storageKey = "morningWriting-" + dateKey + "-" + t.dataset.key;
  t.value = localStorage.getItem(storageKey) || "";
  t.addEventListener("input", () => localStorage.setItem(storageKey, t.value));
});

document.getElementById("another").addEventListener("click", () => {
  index = (index + 1) % prompts.length;
  localStorage.setItem("morningPromptIndex-" + dateKey, index);
  showPrompt();
});

const beginDayButton = document.getElementById("beginDay");
const verse = document.querySelector(".verse");
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let closing = false;
beginDayButton.addEventListener("click", () => {
  if (closing) return;
  closing = true;

  // Release today's writing as the closing ritual begins.
  document.querySelectorAll("textarea").forEach(t => {
    localStorage.removeItem("morningWriting-" + dateKey + "-" + t.dataset.key);
  });

  document.body.classList.add("day-begun");

  // Keep the final verse present for keyboard and screen-reader users, and
  // gently return mobile readers to it when they finish lower on the page.
  verse.focus({preventScroll:true});
  if (window.matchMedia("(max-width: 650px)").matches) {
    requestAnimationFrame(() => {
      verse.scrollIntoView({
        behavior: reducedMotion ? "auto" : "smooth",
        block: "center"
      });
    });
  }

  // Remove the hidden interface after the animation so only the verse remains.
  setTimeout(() => {
    document.querySelectorAll(".top,.intro,.breath-cue,.actions,.prompts,.site-footer").forEach(el => {
      el.setAttribute("aria-hidden", "true");
    });
  }, reducedMotion ? 0 : 14000);
});

// Sunrise breath guide: 6-second inhale, 8-second exhale.
const breathText=document.getElementById("breathText");
const breathStart=performance.now();
function updateBreath(now){
  const elapsed=((now-breathStart)/1000)%14;
  if(elapsed<6){
    breathText.textContent=`Inhale · ${Math.max(1,6-Math.floor(elapsed))}`;
  }else{
    breathText.textContent=`Exhale · ${Math.max(1,8-Math.floor(elapsed-6))}`;
  }
  requestAnimationFrame(updateBreath);
}
if(!reducedMotion){requestAnimationFrame(updateBreath);}
</script>
</body>
</html>
